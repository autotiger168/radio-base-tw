name: 檢查電台連結

on:
  schedule:
    - cron: "43 0 * * 3"    # 每週三 08:43（台灣時間）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 檢查官網、社群與串流網址
        run: node scripts/check-links.mjs
      - name: 提交報告
        run: |
          git config user.name "radio-base-bot"
          git config user.email "radio-base-bot@users.noreply.github.com"
          git add link-report.md
          if git diff --cached --quiet; then echo "報告沒有變更"; else git commit -m "連結檢查報告 $(date -u +%Y-%m-%d)" && git push; fi
