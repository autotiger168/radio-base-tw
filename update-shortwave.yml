name: 更新短波排程

on:
  schedule:
    - cron: "17 19 * * 0"   # 每週一 03:17（台灣時間）
  workflow_dispatch:         # 可在 Actions 頁面手動按 Run workflow

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 下載 EiBi 排程並轉換
        run: node scripts/build-sw.mjs
      - name: 有變更才提交
        run: |
          git config user.name "radio-base-bot"
          git config user.email "radio-base-bot@users.noreply.github.com"
          git add data/sw
          if git diff --cached --quiet; then
            echo "排程沒有變更"
          else
            git commit -m "更新短波排程 $(date -u +%Y-%m-%d)"
            git push
          fi
